# Zabbix monitoring test lab
# ---------------------------------------------------------------
# A small stack of common services plus a Zabbix agent 2 that
# monitors Docker itself and each service, reporting to your
# existing Zabbix 7.0 server.
#
# Start:   ZABBIX_SERVER=192.168.77.170 docker compose up -d
# Stop:    docker compose down          (add -v to wipe volumes)
#
# The agent autoregisters as "docker-lab" using your existing
# linux-lab action. Then link the extra templates by hand
# (see the end of this file).
# ---------------------------------------------------------------

services:

  zabbix-agent2:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: zabbix-agent2
    hostname: docker-lab
    restart: unless-stopped
    user: root                      # lab only: needed to read the Docker socket
    environment:
      ZBX_HOSTNAME: docker-lab
      ZBX_SERVER_HOST: ${ZABBIX_SERVER:-192.168.77.170}     # sets both Server and ServerActive
      ZBX_METADATA: linux-lab docker
      ZBX_TIMEOUT: 10
    ports:
      - "10050:10050"               # server -> agent (Docker template uses passive checks)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - nginx
      - postgres
      - redis

  # --- Monitored services ---------------------------------------

  nginx:
    image: nginx:1.27-alpine
    container_name: lab-nginx
    restart: unless-stopped
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"

  postgres:
    image: postgres:16-alpine
    container_name: lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zbx_monitor
      POSTGRES_PASSWORD: labpassword
      POSTGRES_DB: labdb
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lab-redis
    restart: unless-stopped

  # --- Traffic generator so graphs actually move -----------------

  loadgen:
    image: alpine:3.20
    container_name: lab-loadgen
    restart: unless-stopped
    environment:
      PGPASSWORD: labpassword
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl redis postgresql16-client >/dev/null
        # web + cache traffic, several requests per second
        ( while true; do
            curl -s http://nginx/ >/dev/null
            redis-cli -h redis INCR hits >/dev/null
            sleep 0.2
          done ) &
        # database traffic, one query per second
        while true; do
          psql -h postgres -U zbx_monitor -d labdb -qc "SELECT count(*) FROM pg_stat_activity;" >/dev/null 2>&1
          sleep 1
        done
    depends_on:
      - nginx
      - postgres
      - redis

  # --- Deliberately unreliable container -------------------------
  # Exits with an error every 5 minutes and gets restarted, so you
  # can watch Docker container triggers fire and recover.

  flaky:
    image: alpine:3.20
    container_name: lab-flaky
    restart: always
    command: ["sh", "-c", "echo started; sleep 300; echo crashing; exit 1"]

configs:
  nginx_conf:
    content: |
      server {
        listen 80;
        location / {
          return 200 'hello from the zabbix lab\n';
        }
        location = /basic_status {
          stub_status;
        }
      }

volumes:
  pgdata:

# ---------------------------------------------------------------
# After "docker-lab" appears in Data collection -> Hosts:
#
# 1. Link these templates to it:
#      Docker by Zabbix agent 2
#      Nginx by Zabbix agent
#      PostgreSQL by Zabbix agent 2
#      Redis by Zabbix agent 2
#
# 2. Set host macros so the agent finds each service by its
#    container name (check "Inherited and host macros" for the
#    exact names in your template version):
#      {$NGINX.STUB_STATUS.HOST}   nginx
#      {$NGINX.STUB_STATUS.PATH}   basic_status
#      {$REDIS.CONN.URI}           tcp://redis:6379
#      PostgreSQL connection macro tcp://postgres:5432
#      {$PG.USER}                  zbx_monitor
#      {$PG.PASSWORD}              labpassword
#      {$PG.DATABASE}              labdb
#
# 3. Open TCP 10050 on the Docker host's firewall for 192.168.77.170.
# ---------------------------------------------------------------
